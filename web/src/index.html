<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quicvideo demo</title>
<style>
  :root { color-scheme: dark; --bg: #0f1115; --bar: #181a1e; --tile: #1f2125; --fg: #e6e8eb; --accent: #3a6edc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px; background: var(--bar); flex-wrap: wrap; }
  input { background: var(--tile); color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 6px 8px; width: 9em; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.danger { background: #be3232; margin-left: auto; }
  #status { opacity: .85; min-width: 12em; }
  main { position: relative; flex: 1; overflow: hidden; }
  .tile { position: absolute; background: var(--tile); border-radius: 8px; overflow: hidden; cursor: pointer; }
  .tile canvas { width: 100%; height: 100%; display: block; }
  .tile .label, #self .label { position: absolute; left: 8px; top: 8px; background: #0009; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  #self { position: absolute; right: 12px; bottom: 12px; width: 240px; border-radius: 8px; overflow: hidden; background: var(--tile); display: none; }
  #self video { width: 100%; display: block; }
</style>
</head>
<body>
<header>
  <input id="token" placeholder="token" value="web">
  <input id="room" placeholder="room" value="call">
  <button id="join">Join</button>
  <button id="camera" disabled>Camera on</button>
  <button id="screen" disabled>Share screen</button>
  <span id="status">not connected</span>
  <button id="leave" class="danger" disabled>Leave</button>
</header>
<main id="stage"><div id="self"><video autoplay muted playsinline></video><span class="label">You</span></div></main>
<script type="module" src="demo.js"></script>
</body>
</html>
