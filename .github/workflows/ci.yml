name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          tmp=$(mktemp -d)
          protoc -I proto --go_out="$tmp" --go_opt=module=github.com/boson-chat/quicvideo proto/control.proto
          # Ignore the protoc version comment; only the generated code matters.
          diff <(grep -v '^// .protoc ' "$tmp/gen/controlpb/control.pb.go") \
               <(grep -v '^// .protoc ' gen/controlpb/control.pb.go)
      - name: Native deps (Gio UI; FFmpeg, openh264, PipeWire for client/media on Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev \
            libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev \
            libavcodec-dev libavformat-dev libavdevice-dev libavutil-dev libswscale-dev libopenh264-dev libpipewire-0.3-dev
      - run: go vet ./...
      - run: go test -race ./...

  macos:
    # The darwin media code (ScreenCaptureKit, AVFoundation, VideoToolbox)
    # and the viewer. Capture needs TCC permissions a runner doesn't
    # have, so only builds + the VideoToolbox round trip run here.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./client/... ./examples/viewer/
      - run: go test ./client/... ./examples/viewer/
      - name: viewer links without linker warnings
        run: |
          go build -o /tmp/viewer ./examples/viewer 2>&1 | tee /tmp/build.log
          ! grep -q "warning" /tmp/build.log

  windows:
    # Windows media backend (Media Foundation, Windows.Graphics.Capture) and
    # the viewer. There's no Windows dev machine: this job is the only place
    # the Windows code runs. Hardware-dependent tests skip with a reason.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Use MSYS2's gcc for cgo
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - run: go vet ./...
      - name: Media tests (verbose, to see what ran or skipped)
        run: go test -v -count=1 ./client/media/
      - run: go test -count=1 ./...
      - run: go build -o viewer.exe ./examples/viewer

  web:
    # Browser client: WebTransport to quicvideod, WebCodecs H.264, in real
    # Chromium (fake camera/screen) against a Go bot publishing real H.264.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: ffmpeg (test pattern H.264 for the Go bot)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - working-directory: web
        run: npm ci
      - name: Built bundle is up to date
        working-directory: web
        run: npm run build && git diff --exit-code dist
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webtransport-demo
          path: web/test-results/webtransport-demo.png
